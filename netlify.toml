[build]
  publish = "."

# Proxy: las llamadas a /api/* van a OCI (evita mixed-content HTTPS→HTTP)
[[redirects]]
  from = "/api/*"
  to = "http://146.181.33.44:8080/api/:splat"
  status = 200
  force = true

# OAuth endpoints también necesitan proxy
[[redirects]]
  from = "/oauth2/*"
  to = "http://146.181.33.44:8080/oauth2/:splat"
  status = 200
  force = true

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache para assets estáticos
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cachear HTML y JS (para actualizaciones)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
